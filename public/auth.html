<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeVerse - Login</title>
    <link rel="stylesheet" href="/css/auth.css?v=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Mobile Detection Script -->
    <script>
      (function () {
        function isMobileDevice() {
          const userAgent =
            navigator.userAgent || navigator.vendor || window.opera;

          // Check for mobile devices
          if (/android/i.test(userAgent)) return true;
          if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream)
            return true;
          if (/windows phone/i.test(userAgent)) return true;

          // Check for small screens (tablets and mobile)
          if (window.innerWidth <= 1024) return true;

          // Check for touch-only devices
          if ("ontouchstart" in window && window.innerWidth <= 1024)
            return true;

          return false;
        }

        if (isMobileDevice()) {
          // Prevent page load and show mobile warning
          document.addEventListener("DOMContentLoaded", function () {
            document.body.innerHTML = "";
            document.body.style.cssText =
              'margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh;';

            const container = document.createElement("div");
            container.style.cssText =
              "max-width: 480px; margin: 20px; padding: 48px 40px; background: #1a1a1a; border-radius: 12px; border: 1px solid #2a2a2a; box-shadow: 0 8px 32px rgba(0,0,0,0.4);";

            container.innerHTML = `
              <div style="display: flex; justify-content: center; margin-bottom: 32px;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                  <line x1="8" y1="21" x2="16" y2="21"></line>
                  <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
              </div>
              
              <h1 style="color: #e0e0e0; font-size: 24px; font-weight: 600; margin-bottom: 12px; text-align: center; letter-spacing: -0.02em;">Desktop Required</h1>
              
              <p style="color: #999; font-size: 15px; line-height: 1.6; margin-bottom: 32px; text-align: center;">
                This application requires a desktop browser for optimal performance and functionality.
              </p>
              
              <div style="background: #232323; border: 1px solid #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 24px;">
                <div style="color: #b0b0b0; font-size: 13px; font-weight: 500; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em;">System Requirements</div>
                <div style="space-y: 12px;">
                  <div style="display: flex; align-items: start; margin-bottom: 12px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="margin-right: 12px; margin-top: 2px; flex-shrink: 0;">
                      <polyline points="9 11 12 14 22 4"></polyline>
                      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    <span style="color: #ccc; font-size: 14px; line-height: 1.5;">Windows, macOS, or Linux</span>
                  </div>
                  <div style="display: flex; align-items: start; margin-bottom: 12px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="margin-right: 12px; margin-top: 2px; flex-shrink: 0;">
                      <polyline points="9 11 12 14 22 4"></polyline>
                      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    <span style="color: #ccc; font-size: 14px; line-height: 1.5;">Modern desktop browser</span>
                  </div>
                  <div style="display: flex; align-items: start;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="margin-right: 12px; margin-top: 2px; flex-shrink: 0;">
                      <polyline points="9 11 12 14 22 4"></polyline>
                      <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    <span style="color: #ccc; font-size: 14px; line-height: 1.5;">Minimum 1920×1080 resolution</span>
                  </div>
                </div>
              </div>
              
              <p style="color: #666; font-size: 13px; text-align: center; margin: 0;">
                Please switch to a desktop device to continue
              </p>
            `;

            document.body.appendChild(container);
          });
        }
      })();
    </script>
  </head>
  <body class="auth-body">
    <!-- Auth Container -->
    <div class="auth-container">
      <!-- Card -->
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <h1 class="auth-title">LifeVerse</h1>
          <p class="auth-subtitle">Your Virtual Life Awaits</p>
        </div>

        <!-- Content -->
        <div class="auth-content">
          <!-- Messages -->
          <div id="error-message" class="auth-message error hidden"></div>
          <div id="success-message" class="auth-message success hidden"></div>

          <!-- Login Form -->
          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="login-username"> Username </label>
              <input
                type="text"
                id="login-username"
                class="form-input"
                placeholder="Enter your username"
                required
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password"> Password </label>
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" id="login-button" class="auth-button">
              <span class="auth-button-content">Enter Game</span>
            </button>

            <div class="auth-footer">
              <span class="auth-footer-text">New here? </span>
              <a class="auth-link" id="show-register">Create Account</a>
            </div>
          </form>

          <!-- Register Form -->
          <form id="register-form" class="auth-form hidden">
            <div class="form-group">
              <label class="form-label" for="register-username">
                Username
              </label>
              <input
                type="text"
                id="register-username"
                class="form-input"
                placeholder="Choose a username"
                required
                autocomplete="username"
                minlength="3"
                maxlength="50"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="register-display-name">
                Character Name
              </label>
              <input
                type="text"
                id="register-display-name"
                class="form-input"
                placeholder="Enter your display name"
                required
                maxlength="50"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="register-password">
                Password
              </label>
              <input
                type="password"
                id="register-password"
                class="form-input"
                placeholder="Minimum 6 characters"
                required
                autocomplete="new-password"
                minlength="6"
              />
            </div>

            <div class="form-group">
              <label class="form-label" for="register-password-confirm">
                Confirm Password
              </label>
              <input
                type="password"
                id="register-password-confirm"
                class="form-input"
                placeholder="Re-enter your password"
                required
                autocomplete="new-password"
                minlength="6"
              />
            </div>

            <button type="submit" id="register-button" class="auth-button">
              <span class="auth-button-content">Create Account</span>
            </button>

            <div class="auth-footer">
              <span class="auth-footer-text">Have an account? </span>
              <a class="auth-link" id="show-login">Sign In</a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module">
      const loginForm = document.getElementById("login-form");
      const registerForm = document.getElementById("register-form");
      const errorMessage = document.getElementById("error-message");
      const successMessage = document.getElementById("success-message");

      const showError = (message) => {
        errorMessage.textContent = message;
        errorMessage.classList.remove("hidden");
        errorMessage.classList.add("shake");
        successMessage.classList.add("hidden");
        setTimeout(() => errorMessage.classList.remove("shake"), 400);
      };

      const showSuccess = (message) => {
        successMessage.textContent = message;
        successMessage.classList.remove("hidden");
        errorMessage.classList.add("hidden");
      };

      const hideMessages = () => {
        errorMessage.classList.add("hidden");
        successMessage.classList.add("hidden");
      };

      // Switch between login and register
      document.getElementById("show-register").addEventListener("click", () => {
        loginForm.classList.add("hidden");
        registerForm.classList.remove("hidden");
        hideMessages();
      });

      document.getElementById("show-login").addEventListener("click", () => {
        registerForm.classList.add("hidden");
        loginForm.classList.remove("hidden");
        hideMessages();
      });

      // Login handler
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessages();

        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;
        const loginButton = document.getElementById("login-button");

        loginButton.disabled = true;
        loginButton.innerHTML =
          '<span class="auth-button-content">Loading<span class="spinner"></span></span>';

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });

          const data = await response.json();

          if (data.success) {
            // Save session token
            localStorage.setItem("sessionToken", data.sessionToken);
            localStorage.setItem("user", JSON.stringify(data.user));

            showSuccess("Login successful! Redirecting...");
            setTimeout(() => {
              window.location.href = "/";
            }, 1000);
          } else {
            showError(data.error || "Login failed");
            loginButton.disabled = false;
            loginButton.innerHTML =
              '<span class="auth-button-content">Enter Game</span>';
          }
        } catch (error) {
          showError("Connection error. Please try again.");
          loginButton.disabled = false;
          loginButton.innerHTML =
            '<span class="auth-button-content">Enter Game</span>';
        }
      });

      // Register handler
      registerForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessages();

        const username = document
          .getElementById("register-username")
          .value.trim();
        const displayName = document
          .getElementById("register-display-name")
          .value.trim();
        const password = document.getElementById("register-password").value;
        const passwordConfirm = document.getElementById(
          "register-password-confirm"
        ).value;
        const registerButton = document.getElementById("register-button");

        // Validate passwords match
        if (password !== passwordConfirm) {
          showError("Passwords do not match");
          return;
        }

        registerButton.disabled = true;
        registerButton.innerHTML =
          '<span class="auth-button-content">Creating<span class="spinner"></span></span>';

        try {
          const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username,
              password,
              displayName,
              skinIndex: 0, // Default skin
            }),
          });

          const data = await response.json();

          if (data.success) {
            // Save session token
            localStorage.setItem("sessionToken", data.sessionToken);
            localStorage.setItem("user", JSON.stringify(data.user));

            showSuccess("Account created! Redirecting...");
            setTimeout(() => {
              window.location.href = "/";
            }, 1000);
          } else {
            showError(data.error || "Registration failed");
            registerButton.disabled = false;
            registerButton.innerHTML =
              '<span class="auth-button-content">Create Account</span>';
          }
        } catch (error) {
          showError("Connection error. Please try again.");
          registerButton.disabled = false;
          registerButton.innerHTML =
            '<span class="auth-button-content">Create Account</span>';
        }
      });

      // Check if already logged in
      const sessionToken = localStorage.getItem("sessionToken");
      if (sessionToken) {
        fetch("/api/auth/validate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionToken }),
        })
          .then((res) => res.json())
          .then((data) => {
            if (data.valid) {
              window.location.href = "/";
            }
          })
          .catch(() => {
            // Invalid session, stay on login page
          });
      }
    </script>
  </body>
</html>
